name: Backend NestJS CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/backend-ci.yml
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Crear lockfile reproducible
        run: npm install --package-lock-only
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
      - name: Pruebas
        run: npm test
      - name: Confirmar resultado
        run: echo BACKEND_NESTJS_OK
